services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailapp
      POSTGRES_PASSWORD: mailapp
      POSTGRES_DB: mailapp
    ports:
      - "5432:5432"
    volumes:
      - mailapp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mailapp_pg:
